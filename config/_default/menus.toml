# ==========================================================================
# menus.toml — Navigation Menu (PlasticMolder)
# Internal links are /en/-prefixed for the multilingual subdirectory deployment.
#
# Top-level structure (4 semantic groups + utility links):
#   Services     -> core molding service offerings (points to main service page)
#   Industries   -> by-industry / application verticals (points to /categories/industries/ hub)
#   Materials    -> by-resin molding pages (points to /categories/materials/ hub)
#   Capabilities -> specialized techniques & production capability pages
#                   (points to /categories/capabilities/ hub — fixes the prior
#                    "Capabilities" anchor collision)
# All existing URLs are preserved; links were only moved between groups.
# "precision-plastic-components" was added to Capabilities (was missing from nav).
# ==========================================================================

[[main]]
  name = "Home"
  url = "/en/"
  weight = 1

