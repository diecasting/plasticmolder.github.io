# --- Industry catalog (language-neutral IDs) ---

[[industries]]
id = "automotive"
sort_order = 1

[[industries]]
id = "medical"
sort_order = 2

[[industries]]
id = "electronics"
sort_order = 3

[[industries]]
id = "ev-energy"
sort_order = 4

[[industries]]
id = "industrial"
sort_order = 5

# --- Localized industry names and descriptions ---

[en.automotive]
name = "Automotive"
description = "Injection molded interior trims, connectors, housings and under-hood plastic components with PPAP-level documentation."
applications = ["Interior trim parts", "Connectors & clips", "Sensor housings", "Under-hood components"]

[en.medical]
name = "Medical Devices"
description = "Medical-grade precision molding for diagnostic housings, disposables and device components with full lot traceability."
applications = ["Diagnostic device housings", "Disposable components", "Lab consumables", "Surgical device parts"]

[en.electronics]
name = "Electronics"
description = "Precision enclosures, connectors and structural parts for consumer and industrial electronics."
applications = ["Electronic enclosures", "Precision connectors", "Structural frames", "Wearable housings"]

[en.ev-energy]
name = "EV & New Energy"
description = "Plastic components for EV charging piles, battery modules and energy storage systems using flame-retardant engineering resins."
applications = ["EV charging pile housings", "Battery module components", "Busbar insulation parts", "Energy storage enclosures"]

[en.industrial]
name = "Industrial Equipment"
description = "Durable engineering plastic parts for industrial machinery, automation and fluid handling."
applications = ["Machine housings", "Gears & bushings", "Pump components", "Automation fixtures"]

[de.automotive]
