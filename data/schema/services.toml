# --- Localized service names and descriptions ---

[en.plastic-injection-molding]
name = "Plastic Injection Molding"
description = "Full-service plastic injection molding from 50T to 800T presses. ABS, PC, PP, PA, POM, TPU processing with tight tolerance control for global OEMs."

[en.custom-plastic-injection-molding]
name = "Custom Plastic Injection Molding"
description = "Custom injection molding tailored to your part design — DFM analysis, material selection, tooling and production under one roof."

[en.plastic-injection-mold-manufacturing]
name = "Plastic Injection Mold Manufacturing"
description = "Precision injection mold design and fabrication — P20, 718H, NAK80, S136 tool steels, hot runner systems, 300,000+ shot guarantees."

[en.prototype-injection-molding]
name = "Prototype Injection Molding"
description = "Quick-turn prototype tooling and molded prototypes in production-grade resins within 7-15 days."

[en.low-volume-injection-molding]
name = "Low Volume Injection Molding"
description = "Cost-effective low volume injection molding from 100 to 100,000 parts with soft steel or pre-hardened tool steel tooling."

[en.plastic-injection-molding-services]
name = "Plastic Injection Molding Services"
description = "End-to-end injection molding services: design support, mold making, molding, assembly and quality inspection."

[en.oem-plastic-parts-manufacturer]
name = "OEM Plastic Parts Manufacturing"
description = "OEM/ODM plastic parts production for automotive, medical, electronics, EV and industrial brands worldwide."

[en.custom-plastic-parts-manufacturer]
name = "Custom Plastic Parts Manufacturing"
description = "Custom plastic parts engineered to print — insert molding, overmolding, secondary operations and assembly."

[en.precision-plastic-components]
name = "Precision Plastic Components"
description = "High-precision plastic components with tolerances down to ±0.01 mm, CMM-verified dimensional reports."

[en.precision-medical-molding]
name = "Precision Medical Molding"
description = "Medical-grade plastic injection molding with cleanroom-compatible processes, full traceability and ISO 13485-aligned quality systems."

